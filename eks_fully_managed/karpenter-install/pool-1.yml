apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: flex-karpenter-jobs
  annotations:
    kubernetes.io/description: "These nodes will be only used for Job Pods"
spec:
  template:
    metadata:
      labels:
        intent: flex-karpenter-managed
        # environment: prod # Billing label
        # cost-center: blackink-prod # Cost center label
        usage: job-pods
    spec:
      taints:
      - key: usage
        value: job-pods
        effect: NoSchedule
      expireAfter: 8760h
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: [ "spot", "on-demand" ]
      - key: kubernetes.io/arch
        operator: In
        values: [ "amd64" ] # x86_64 architecture for m6a
      - key: node.kubernetes.io/instance-type
        operator: In
        values: [ "m7i-flex.large", "c7i-flex.large" ] # Including smaller instances for cost optimization
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - us-east-1a
        - us-east-1b
        - us-east-1c
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values: [ "2" ]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: prod-karpenter-jobs-class
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "12"
    memory: 48Gi
  weight: 10
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: prod-karpenter-jobs-class
spec:
  amiFamily: AL2023
  amiSelectorTerms:
  # - alias: al2023@latest
  - id: "ami-038307b5108a3e3dd"
  associatePublicIPAddress: false
  detailedMonitoring: false
  # role: arn:aws:iam::454550199189:role/KarpenterNodeRolcate-precta_cluser_eks
  instanceProfile: "KarpenterNodeInstanceProfile-precta_cluser_eks"
  subnetSelectorTerms:
  - id: "subnet-044d8441ada59b31b"
  - id: "subnet-049c199007d52c4ac"
  securityGroupSelectorTerms:
  - id: "sg-0a6037f68bca0a803" # security group that has to be attached to nodes
  # amiSelectorTerms:

  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      volumeSize: 250Gi
      volumeType: gp3
      encrypted: true
  kubelet:
    # clusterDNS: ["172.20.0.10"]
    imageGCHighThresholdPercent: 70
    imageGCLowThresholdPercent: 60
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2 # This is changed to disable IMDS access from containers not on the host network
    httpTokens: required
